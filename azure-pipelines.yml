
# LifestyleMart - CI Pipeline

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'

steps:
  # 1. Set up Python
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(pythonVersion)'
    displayName: 'Set up Python'

  # 2. Upgrade pip
  - script: |
      python -m pip install --upgrade pip
    displayName: 'Upgrade pip'

  # 3. Install project dependencies
  - script: |
      pip install -r requirements.txt
    displayName: 'Install dependencies'

  # 4. Validate installed dependencies
  - script: |
      pip check
    displayName: 'Check dependencies'

  # 5. Validate Python syntax
  - script: |
      python -m compileall -q app.py database_setup.py payment_gateway.py seed_eco.py migrate_eco.py
    displayName: 'Validate Python code'

  - script: |
      python -m pip install pytest
    displayName: 'Install pytest'

  - script: |
      mkdir -p test-results
      python -m pytest -v --junitxml=test-results/pytest-results.xml
    displayName: 'Run automated tests'

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'test-results/pytest-results.xml'
      failTaskOnFailedTests: true
      testRunTitle: 'LifestyleMart Python Tests'
    condition: succeededOrFailed()
