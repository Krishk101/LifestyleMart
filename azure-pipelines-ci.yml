# LifestyleMart - Continuous Integration Pipeline

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'

steps:
  # 1. Configure Python
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(pythonVersion)'
    displayName: 'Set up Python'

  # 2. Install dependencies
  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install dependencies'

  # 3. Validate dependencies
  - script: |
      pip check
    displayName: 'Check dependencies'

  # 4. Validate Python syntax
  - script: |
      python -m compileall -q app.py database_setup.py payment_gateway.py seed_eco.py migrate_eco.py
    displayName: 'Validate Python code'

  # 5. Install pytest
  - script: |
      python -m pip install pytest
    displayName: 'Install pytest'

  # 6. Run automated tests
  - script: |
      mkdir -p test-results
      python -m pytest -v --junitxml=test-results/pytest-results.xml
    displayName: 'Run automated tests'

  # 7. Publish test results
  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'test-results/pytest-results.xml'
      failTaskOnFailedTests: true
      testRunTitle: 'LifestyleMart Python Tests'
    condition: succeededOrFailed()

  # 8. Package application
  - script: |
      python - <<'PY'
      from pathlib import Path
      from zipfile import ZipFile, ZIP_DEFLATED

      source = Path("$(Build.SourcesDirectory)")
      output = Path("$(Build.ArtifactStagingDirectory)") / "LifestyleMart.zip"

      excluded_dirs = {
          ".git", ".venv", "venv", "terraform", "tests",
          "instance", ".github", "__pycache__", ".pytest_cache"
      }

      with ZipFile(output, "w", ZIP_DEFLATED) as archive:
          for path in source.rglob("*"):
              if not path.is_file():
                  continue

              relative = path.relative_to(source)

              if any(part in excluded_dirs for part in relative.parts):
                  continue

              if (
                  path.name == ".env"
                  or path.name.startswith(".env.")
                  or path.suffix in {".pyc", ".db", ".sqlite", ".sqlite3"}
              ):
                  continue

              archive.write(path, relative.as_posix())

      print(f"Created deployment package: {output}")
      PY
    displayName: 'Package LifestyleMart application'

  # 9. Publish deployment artifact
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/LifestyleMart.zip'
      artifact: 'LifestyleMart'
      publishLocation: 'pipeline'
    displayName: 'Publish deployment artifact'
